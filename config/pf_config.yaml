enu_origin:
  lat: 45.7896
  lon: 21.1928

particle_filter:
  n_dispersed: 200
  n_tracking: 100
  sigma_pos_dispersed: 3.0
  sigma_pos_tracking: 1.0
  sigma_hdg_dispersed: 10.0
  sigma_hdg_tracking: 3.0
  sigma_obs_coarse: 40.0         # tuned: grid search best (40 > 30 prevents particle deprivation)
  sigma_obs_fine: 5.0            # tuned: grid search best (5 < 8, tighter fine observation)
  top_k_coarse: 5
  ess_threshold_fraction: 0.5
  init_altitude_m: 50.0          # tuned: was 15 — only init when high enough for VPR
  converge_spread_m: 60.0        # tuned: grid search best
  tracking_spread_m: 30.0        # tuned: grid search best (30 > 20, easier TRACKING entry)
  lost_spread_m: 150.0
  fine_every_n_frames: 2         # tuned: grid search best (more frequent fine updates)
  fine_min_inliers_heading: 12
  # Adaptive search (driven by particle spread)
  min_search_radius_m: 40.0
  search_radius_multiplier: 2.5
  base_context_fraction: 0.2
  max_context_fraction: 1.0
  # Altitude-adaptive coarse sigma
  altitude_sigma_enabled: false
  altitude_sigma_ref_m: 60.0
  altitude_sigma_scale: 0.5
  # Fine match consistency gate (0 = disabled)
  fine_consistency_max_m: 0.0

matchers:
  script_dir: "/media/aniel/storage/bags_jetson/vpr_dinov3/dinov2_vits_layer_test"
  boq_engine_path: "dinov3_lora_gray_boq_l10_value_256.engine"
  fine_engine_path: "MatchAnything/matchanything_eloftr_320.trt"
  boq_database_path: "data/descriptors_boq/boq_descriptors.pt"
  patch_names_path: "data/descriptors_boq/patch_names.txt"
  gps_metadata_path: "data/patches/gps_metadata.json"
  patches_dir: "data/patches"
  image_size: 256
  grayscale: true
  matcher_resolution: 320
  camera_fx: 501.8
  camera_fy: 502.1
  camera_cx: 151.1
  camera_cy: 221.9
  context_enabled: true
  context_fraction: 0.5
  fine_conf_threshold: 0.20
  min_inliers_ransac: 4
  min_inliers: 8

init:
  lock_n_frames: 4          # consecutive top-1 hits before seeding
  lock_sim_threshold: 0.40  # minimum sim to count as a hit

replay:
  mcap_path: "/media/aniel/storage/bags_jetson/095c6d2c7237fe986c6240628b6ef8dd/Day2.6_0.mcap"
  camera_topic: "/camera/image_mono"
  rtk_topic: "/m300/rtk/fix"
  yaw_topic: "/m300/rtk/yaw"
  altimeter_topic: "/altimeter/range"
  start_offset_s: 55.0        # skip this many seconds from bag start
  camera_subsample: 1
  altitude_min_process_m: 50.0  # skip camera frames if median altitude below this
  output_csv: "results/pf_results.csv"
  output_plot: "results/pf_trajectory.png"
